name: Build surmise documentation
env:
  CLONE_PATH: ${{ github.workspace }}
  HTML_DOCS:  ${{ github.workspace }}/docs/build_html
  PDF_DOCS:   ${{ github.workspace }}/docs/build_pdf
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  # Get user/group of runner account so that subsequent jobs can run containers
  # using that account rather than root.  Based on discussions in:
  #                https://github.com/actions/runner/issues/691
  configure:
     runs-on: ubuntu-latest
     outputs:
       uid_gid: ${{ steps.get_user.outputs.uid_gid }}
     steps:
       - id: get_user
         run: |
            MY_UID=$(id -u)
            MY_GID=$(id -g)
            echo "User = $(id -u -n) ($MY_UID)"
            echo "Group = $(id -g -n) ($MY_GID)"
            echo "uid_gid=$MY_UID:$MY_GID" >> "$GITHUB_OUTPUT"

  build_pypkg_sphinx:
    # Prefer LaTeX installation by official image over manual installation to
    # get more consistent and quick setup times.
    runs-on: ubuntu-latest
    needs: configure
    env:
      UID_GID: ${{ needs.configure.outputs.uid_gid }}
    container:
      image: texlive/texlive:latest
      options: --user ${{ needs.configure.outputs.uid_gid }}
    steps:
    ##-- General Setup Steps
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    # numpy version needed to build package is old enough that it is being built
    # from source, which requires a compiler.
    - name: Install GCC
      run: |
        apk update
        apk add build-base
        gcc --version

    - name: Setup python with tox
      run: |
        echo "UID/GID from configure = $UID_GID"
        echo "UID/GID actual         = $(id -u):$(id -g)"
        $CLONE_PATH/.github/workflows/install_tox.sh
    - name: Build sphinx docs
      run: |
        cd $CLONE_PATH
        tox -r -e pdf,html

    ##-- Make documents available as artifacts
    - name: Archive surmise docs
      uses: actions/upload-artifact@v6
      with:
        name: surmise-sphinx-docs
        path: |
          ${{ env.HTML_DOCS }}
          ${{ env.PDF_DOCS }}
